  bio_description: |
    Hello! I'm Oscar, also known as sk4rz in the cybersecurity community.
    I'm a 19-year-old Systems Engineering student with a deep passion for information security, 
    low-level programming, and understanding how systems work at their core.

    My journey in cybersecurity started with curiosity about how malware operates and how systems 
    can be protected against various threats. This led me to explore areas like malware analysis, 
    exploit development, penetration testing, and reverse engineering.

  learning_description: |
    As a Systems Engineering student, I'm constantly learning and exploring new technologies. 
    Currently, I'm diving deeper into PHP development while strengthening my foundation in 
    system-level programming with C and C++.

    I believe in hands-on learning and practical application of knowledge. Most of my learning 
    comes from building projects, participating in CTFs, and analyzing real-world security scenarios.

  blog_description: |
    This blog serves as my digital notebook where I document my learning journey, share technical 
    insights, and discuss various topics related to cybersecurity and software development. 
    You'll find posts about:

    - Malware analysis techniques and tools
    - Low-level programming concepts
    - Exploit development and reverse engineering
    - System security and hardening
    - Programming tutorials and tips
    - CTF writeups and walkthroughs

