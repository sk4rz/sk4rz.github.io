  bio_description: |
    ¡Hola! Soy Oscar, también conocido como sk4rz en la comunidad de ciberseguridad.
    Soy un estudiante de Ingeniería de Sistemas de 19 años con una profunda pasión por la seguridad 
    de la información, la programación de bajo nivel y entender cómo funcionan los sistemas en su núcleo.

    Mi viaje en ciberseguridad comenzó con curiosidad sobre cómo opera el malware y cómo los sistemas 
    pueden protegerse contra varias amenazas. Esto me llevó a explorar áreas como análisis de malware, 
    desarrollo de exploits, pruebas de penetración e ingeniería inversa.

  learning_description: |
    Como estudiante de Ingeniería de Sistemas, estoy constantemente aprendiendo y explorando nuevas 
    tecnologías. Actualmente, me estoy adentrando más en el desarrollo de PHP mientras fortalezco mi 
    fundación en programación a nivel de sistema con C y C++.

    Creo en el aprendizaje práctico y la aplicación práctica del conocimiento. La mayor parte de mi 
    aprendizaje proviene de construir proyectos, participar en CTFs y analizar escenarios de seguridad 
    del mundo real.

  blog_description: |
    Este blog sirve como mi cuaderno digital donde documento mi viaje de aprendizaje, comparto 
    conocimientos técnicos y discuto varios temas relacionados con ciberseguridad y desarrollo de software. 
    Encontrarás publicaciones sobre:

    - Técnicas y herramientas de análisis de malware
    - Conceptos de programación de bajo nivel
    - Desarrollo de exploits e ingeniería inversa
    - Seguridad y endurecimiento de sistemas
    - Tutoriales y consejos de programación
    - Writeups y guías de CTF

