<!--
  The Footer
-->

<footer class="d-flex w-100 justify-content-center">
  <div class="d-flex flex-column justify-content-center align-items-center">
    <p class="mb-0">
      © {{ 'now' | date: '%Y' }}
      <a href="{{ site.social.links[0] }}">{{ site.social.name | default: site.author }}</a>.

      {% if site.data.locales[include.lang].copyright.brief %}
        <span data-bs-toggle="tooltip" data-bs-placement="top"
          title="{{ site.data.locales[include.lang].copyright.verbose }}">{{ site.data.locales[include.lang].copyright.brief }}</span>
      {% endif %}
    </p>

    <p class="mb-0">
      <em>
        Powered by <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a> &
        <a href="https://github.com/cotes2020/jekyll-theme-chirpy/" target="_blank" rel="noopener">Chirpy</a>
      </em>
    </p>
  </div>
</footer>
