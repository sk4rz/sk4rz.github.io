<!-- Language system scripts -->
<script src="{{ '/assets/js/language-switcher.js' | relative_url }}"></script>

<!-- Sidebar filtering script -->
<script>
function filterSidebar() {
  // Get current page language
  var currentLang = "en";
  
  // Check if we're on a Spanish page
  if (window.location.pathname.includes("/es/")) {
    currentLang = "es";
  }
  
  // Find all sidebar navigation links - try multiple selectors
  var possibleSelectors = [
    '#sidebar .nav a',
    '#sidebar nav a', 
    '.sidebar .nav a',
    '.sidebar nav a',
    '[data-toggle="sidebar"] a',
    '.nav-link'
  ];
  
  var links = [];
  possibleSelectors.forEach(function(selector) {
    var found = document.querySelectorAll(selector);
    if (found.length > 0) {
      links = Array.from(found);
    }
  });
  
  // Debug: log what we found
  console.log('Found ' + links.length + ' sidebar links');
  
  // Hide tabs that don't match current language
  links.forEach(function(link) {
    var span = link.querySelector('span');
    if (span) {
      var text = span.textContent.trim();
      console.log('Found tab: ' + text);
      
      // Define duplicates to hide
      var shouldHide = false;
      
      if (currentLang === 'en') {
        // Hide Spanish tabs when on English pages
        if (['Inicio', 'Categorías', 'Etiquetas', 'Archivo', 'Acerca de'].includes(text)) {
          shouldHide = true;
        }
      } else {
        // Hide English tabs when on Spanish pages  
        if (['Home', 'Categories', 'Tags', 'Archives', 'About'].includes(text)) {
          shouldHide = true;
        }
      }
      
      if (shouldHide) {
        link.style.display = 'none';
        console.log('Hiding tab: ' + text);
      }
    }
  });
}

// Run the filter function
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(filterSidebar, 100);
  // Run again after a longer delay in case the sidebar loads slowly
  setTimeout(filterSidebar, 1000);
});
</script>
