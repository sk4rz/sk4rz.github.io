<div class="language-selector">
  <div class="dropdown">
    {% assign current_lang = page.lang | default: site.lang | default: 'en' %}
    <button
      class="btn btn-outline-primary btn-sm dropdown-toggle"
      type="button"
      id="languageDropdown"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      <i class="fas fa-globe"></i>
      {% if current_lang == 'es' %}🇪🇸 Español{% else %}🇺🇸 English{% endif %}
    </button>
    <ul class="dropdown-menu" aria-labelledby="languageDropdown">
      {% if current_lang != 'en' %}
      <li>
        <a
          class="dropdown-item"
          href="{{ page.url | replace: '/es', '' | relative_url }}"
        >
          🇺🇸 English
        </a>
      </li>
      {% endif %} {% if current_lang != 'es' %}
      <li>
        <a class="dropdown-item" href="/es{{ page.url | relative_url }}">
          🇪🇸 Español
        </a>
      </li>
      {% endif %}
    </ul>
  </div>
</div>

<style>
  .language-selector {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
  }

  .language-selector .dropdown-toggle {
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.875rem;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 0, 0, 0.1);
  }

  .language-selector .dropdown-toggle:hover {
    background: rgba(255, 255, 255, 1);
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }

  .language-selector .dropdown-menu {
    border-radius: 10px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    backdrop-filter: blur(10px);
    background: rgba(255, 255, 255, 0.95);
  }

  .language-selector .dropdown-item {
    padding: 8px 16px;
    transition: all 0.2s ease;
  }

  .language-selector .dropdown-item:hover {
    background-color: rgba(0, 123, 255, 0.1);
    transform: translateX(2px);
  }

  @media (max-width: 768px) {
    .language-selector {
      top: 10px;
      right: 10px;
    }

    .language-selector .dropdown-toggle {
      padding: 6px 12px;
      font-size: 0.8rem;
    }
  }

  /* Dark mode support */
  [data-bs-theme="dark"] .language-selector .dropdown-toggle {
    background: rgba(33, 37, 41, 0.9);
    border-color: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  [data-bs-theme="dark"] .language-selector .dropdown-toggle:hover {
    background: rgba(33, 37, 41, 1);
  }

  [data-bs-theme="dark"] .language-selector .dropdown-menu {
    background: rgba(33, 37, 41, 0.95);
    border-color: rgba(255, 255, 255, 0.1);
  }

  [data-bs-theme="dark"] .language-selector .dropdown-item {
    color: #fff;
  }

  [data-bs-theme="dark"] .language-selector .dropdown-item:hover {
    background-color: rgba(0, 123, 255, 0.2);
  }
</style>

<script>
  // Language switcher functionality
  document.addEventListener("DOMContentLoaded", function () {
    const languageLinks = document.querySelectorAll(
      ".language-selector .dropdown-item"
    );

    languageLinks.forEach((link) => {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        const newLang = this.href.includes("/es/") ? "es" : "en";
        const currentPath = window.location.pathname;

        // Remove language prefix from current path
        let cleanPath = currentPath.replace(/^\/(es|en)\//, "/");
        if (cleanPath === "/") cleanPath = "";

        // Construct new URL
        let newUrl;
        if (newLang === "en") {
          newUrl = window.location.origin + cleanPath;
        } else {
          newUrl = window.location.origin + "/" + newLang + cleanPath;
        }

        // Store language preference
        localStorage.setItem("preferred-language", newLang);

        // Navigate to new URL
        window.location.href = newUrl;
      });
    });

    // Auto-redirect based on stored preference
    const preferredLang = localStorage.getItem("preferred-language");
    const currentLang = document.documentElement.lang || "en";

    if (
      preferredLang &&
      preferredLang !== currentLang &&
      window.location.pathname === "/"
    ) {
      if (preferredLang === "es") {
        window.location.href = window.location.origin + "/es/";
      }
    }
  });
</script>
