  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sk4rz blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        /* VT323 for headers, Fira Code for body */
        font-family: 'Fira Code', monospace;
      }
      .font-display {
        font-family: 'VT323', monospace;
      }
      .font-code {
        font-family: 'Fira Code', monospace;
      }
      .pixelated-look {
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .prose p, .prose li {
        text-align: justify;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 4px;
        border: 2px solid #1a1a1a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #6a6a6a;
      }
      /* Panel Link Hover Effect */
      .panel-link:hover .link-text::before {
        content: '> ';
        color: #a78bfa; /* violet-400 */
        font-weight: bold;
      }
    </style>
